mkdir -p .github/workflows && cat << 'EOF' > .github/workflows/upload.yml
name: Automated Video Processor & YouTube Uploader

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 ffmpeg-python

      - name: Run Video Processor & YouTube Uploader
        run: |
          python uploader.py
EOF

git add .github/workflows/upload.yml && git commit -m "Fix workflow syntax for run button" && git push origin main
